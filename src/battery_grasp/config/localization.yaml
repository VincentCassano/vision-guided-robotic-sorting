# 作用：配置三维定位、深度有效范围和机器人允许工作区等安全参数

# 深度有效范围（米）
min_depth: 0.30
max_depth: 1.50

# 当前模拟工作区范围（米）
workspace:
  x_min: -0.50
  x_max: 0.50

  y_min: -0.50
  y_max: 0.50

  z_min: 0.30
  z_max: 1.50

# 深度采样区域半径
depth_window: 2

# RViz Marker 大小
marker_size: 0.12

# 抓取流程模拟参数
grasp:
  pregrasp_offset_y: -0.20
  grasp_offset_y: -0.03
  lift_height: 0.15
  step_delay: 1.0